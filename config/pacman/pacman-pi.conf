# Omarchy pacman config, Pi/aarch64 variant.
#
# Differences from upstream default/pacman/pacman-edge.conf:
#   - [multilib] removed (x86-only, has no aarch64 counterpart)
#   - core/extra come from Arch Linux ARM, not Omarchy's Arch mirror
#     (stable-mirror.omarchy.org has no aarch64 tree)
#   - [alarm] and [aur] added: Arch Linux ARM's own repos
#   - [omarchy-pi] added ahead of [omarchy] for any local rebuild that has to
#     override an upstream package. Empty by default.
#
# [omarchy] is upstream's own repo. Since September 2026 pkgs.omarchy.org
# publishes an aarch64 tree, built against Arch Linux ARM, on the edge channel
# (152 packages, including omarchy itself). Stable carries 26 aarch64 packages
# and not omarchy, so edge is the only channel that works today. The
# pre-refresh-pacman hook keeps whatever channel omarchy-refresh-pacman is
# asked for, and this file is the template it rewrites.

[options]
Color
ILoveCandy
VerbosePkgLists
HoldPkg = pacman glibc
Architecture = aarch64
CheckSpace
ParallelDownloads = 5

# Arch Linux ARM signs packages but not repo databases, and ships no .db.sig
# files -- DatabaseOptional is required or every sync 404s on core.db.sig.
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[alarm]
Include = /etc/pacman.d/mirrorlist

[aur]
Include = /etc/pacman.d/mirrorlist

[omarchy-pi]
SigLevel = Optional TrustAll
Server = file:///var/cache/omarchy-pi/repo

# Signed with Omarchy's key (40DFB630FF42BCFFB047046CF0134EE680CAC571), which
# omarchy-keyring installs. Packages carry detached .sig files; the database
# does not embed them.
[omarchy]
Server = https://pkgs.omarchy.org/edge/$arch
